# 不上 Mac App Store：沙盒不允许管理 Lima 这样的外部 VM 进程。
appId: dev.ccvm.desktop
productName: CCVM
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
# node-pty 的 spawn-helper 解包后补回执行权限（否则内嵌终端报 posix_spawnp failed）
afterPack: build/after-pack.cjs
extraResources:
  - from: build/kit
    to: kit
mac:
  category: public.app-category.developer-tools
  # 构建时由 build/make-icon.mjs 画出来、iconutil 转换（不进仓库）
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  extendInfo:
    LSUIElement: true
    NSHumanReadableCopyright: CCVM
